databases:
  - name: leitura-borra-cafe-db
    databaseName: leitura_borra_cafe
    user: leitura_borra_cafe
    plan: free
    region: oregon

services:
  - type: web
    name: leitura-borra-cafe
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev is required: Render sets NODE_ENV=production, which would
    # otherwise skip vite/esbuild/drizzle-kit and break the build.
    buildCommand: npm ci --include=dev && npm run build && npm run db:push
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leitura-borra-cafe-db
          property: connectionString
      # Generated by Render on first deploy; signs the session JWT.
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: dandan
      # Set manually in the Render dashboard — never committed.
      - key: ADMIN_PASS
        sync: false
      # Kimi OAuth is disabled; the app uses username/password login.
      - key: APP_ID
        value: ""
      - key: KIMI_AUTH_URL
        value: ""
      - key: KIMI_OPEN_URL
        value: ""
      - key: OWNER_UNION_ID
        value: ""
